<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Apresentação</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .presentation {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      background: #000;
      cursor: default;
    }

    .slides-container {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.45s cubic-bezier(.2,.85,.25,1);
      will-change: transform;
    }

    .slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000;
    }

    .slide-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    .video-slide {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    .video-slide video {
      width: min(80vh, 80vw);
      height: min(80vh, 80vw);
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      background: #000;
    }

    .nav-controls {
      position: fixed;
      z-index: 20;
      right: 28px;
      bottom: 22px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(0,0,0,.15);
      padding: 8px 13px;
      border-radius: 999px;
      box-shadow: 0 18px 50px rgba(0,0,0,.25);
      backdrop-filter: blur(12px);
      transition: opacity .25s ease, visibility .25s ease;
    }

    .nav-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: #f0f0f0;
      color: #111;
      cursor: pointer;
      font-size: 1.25rem;
      font-weight: 900;
      transition: .2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      padding: 0;
    }

    .nav-btn:hover {
      background: #111;
      color: #fff;
      transform: translateY(-1px);
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      pointer-events: none;
    }

    .slide-counter {
      font-family: monospace;
      font-size: .88rem;
      color: #111;
      padding: 0 8px;
      min-width: 70px;
      text-align: center;
      font-weight: bold;
    }

    .progress {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,.18);
      z-index: 19;
      transition: opacity .25s ease, visibility .25s ease;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #ffffff, #d6a85e);
      transition: width .35s ease;
    }

    .presentation.is-fullscreen .nav-controls,
    .presentation.is-fullscreen .progress {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .nav-controls {
        left: 50%;
        right: auto;
        bottom: 12px;
        transform: translateX(-50%);
      }

      .video-slide video {
        width: min(88vh, 88vw);
        height: min(88vh, 88vw);
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="presentation" id="presentation">
    <div class="slides-container" id="slidesContainer">

      <section class="slide">
        <img class="slide-image" src="assets/slide1.png" alt="Slide 1">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide2.png" alt="Slide 2">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide3.png" alt="Slide 3">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide4.png" alt="Slide 4">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide5.png" alt="Slide 5">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide6.png" alt="Slide 6">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide7.png" alt="Slide 7">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide8.png" alt="Slide 8">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide9.png" alt="Slide 9">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide10.png" alt="Slide 10">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide11.png" alt="Slide 11">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide12.png" alt="Slide 12">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide13.png" alt="Slide 13">
      </section>

      <section class="slide">
        <div class="video-slide">
          <video id="demoVideo" src="assets/demo.mp4" controls playsinline webkit-playsinline></video>
        </div>
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide15.png" alt="Slide 15">
      </section>

    </div>

    <div class="nav-controls" id="navControls">
      <button class="nav-btn" id="prevBtn" aria-label="Slide anterior" title="Anterior">
        ‹
      </button>

      <div class="slide-counter" id="slideCounter">1 / 15</div>

      <button class="nav-btn" id="nextBtn" aria-label="Próximo slide" title="Próximo">
        ›
      </button>

      <button class="nav-btn" id="fullscreenBtn" aria-label="Tela cheia" title="Tela cheia">
        <svg id="fullscreenIcon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 3H3v4h2V5h2V3zm14 0h-4v2h2v2h2V3zM5 17H3v4h4v-2H5v-2zm16 0h-2v2h-2v2h4v-4z"/>
        </svg>
      </button>
    </div>

    <div class="progress" id="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <script>
    const presentation = document.getElementById("presentation");
    const slidesContainer = document.getElementById("slidesContainer");
    const slides = document.querySelectorAll(".slide");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const fullscreenIcon = document.getElementById("fullscreenIcon");
    const slideCounter = document.getElementById("slideCounter");
    const progressBar = document.getElementById("progressBar");
    const demoVideo = document.getElementById("demoVideo");

    let currentSlide = 0;
    const totalSlides = slides.length;

    function updatePresentation() {
      slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;
      slideCounter.textContent = `${currentSlide + 1} / ${totalSlides}`;
      progressBar.style.width = `${((currentSlide + 1) / totalSlides) * 100}%`;

      if (demoVideo && currentSlide !== 13) {
        demoVideo.pause();
        demoVideo.currentTime = 0;
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        updatePresentation();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updatePresentation();
      }
    }

    function isFullscreenActive() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.msFullscreenElement
      );
    }

    function updateFullscreenState() {
      const active = isFullscreenActive();

      if (active) {
        presentation.classList.add("is-fullscreen");
        fullscreenIcon.innerHTML = `
          <path d="M9 9H3V3h2v4h4v2zm12 0h-6V7h4V3h2v6zM5 15H3v6h6v-2H5v-4zm16 0h-2v4h-4v2h6v-6z"/>
        `;
        fullscreenBtn.title = "Sair da tela cheia";
        fullscreenBtn.setAttribute("aria-label", "Sair da tela cheia");
      } else {
        presentation.classList.remove("is-fullscreen");
        fullscreenIcon.innerHTML = `
          <path d="M7 3H3v4h2V5h2V3zm14 0h-4v2h2v2h2V3zM5 17H3v4h4v-2H5v-2zm16 0h-2v2h-2v2h4v-4z"/>
        `;
        fullscreenBtn.title = "Tela cheia";
        fullscreenBtn.setAttribute("aria-label", "Tela cheia");
      }
    }

    async function toggleFullscreen() {
      try {
        if (!isFullscreenActive()) {
          if (presentation.requestFullscreen) {
            await presentation.requestFullscreen();
          } else if (presentation.webkitRequestFullscreen) {
            presentation.webkitRequestFullscreen();
          } else if (presentation.msRequestFullscreen) {
            presentation.msRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
          }
        }
      } catch (error) {
        console.warn("Não foi possível alternar para tela cheia:", error);
      }
    }

    nextBtn.addEventListener("click", nextSlide);
    prevBtn.addEventListener("click", prevSlide);
    fullscreenBtn.addEventListener("click", toggleFullscreen);

    document.addEventListener("fullscreenchange", updateFullscreenState);
    document.addEventListener("webkitfullscreenchange", updateFullscreenState);
    document.addEventListener("msfullscreenchange", updateFullscreenState);

    document.addEventListener("keydown", function(event) {
      const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : "";

      if (activeTag === "input" || activeTag === "textarea") return;

      if (event.key === "ArrowRight" || event.key === " ") {
        event.preventDefault();
        nextSlide();
      }

      if (event.key === "ArrowLeft") {
        event.preventDefault();
        prevSlide();
      }

      if (event.key === "f" || event.key === "F") {
        event.preventDefault();
        toggleFullscreen();
      }

      if (event.key === "Escape" && demoVideo && currentSlide !== 13) {
        demoVideo.pause();
        demoVideo.currentTime = 0;
      }
    });

    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener("touchstart", function(event) {
      touchStartX = event.changedTouches[0].screenX;
    }, { passive: true });

    document.addEventListener("touchend", function(event) {
      touchEndX = event.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const swipeDistance = touchEndX - touchStartX;

      if (swipeDistance < -50) {
        nextSlide();
      }

      if (swipeDistance > 50) {
        prevSlide();
      }
    }

    updatePresentation();
    updateFullscreenState();
  </script>
</body>
</html>
