<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Apresentação</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .presentation {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    .slides-container {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.45s cubic-bezier(.2,.85,.25,1);
      will-change: transform;
    }

    .slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000;
    }

    .slide-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    .video-slide {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    .video-slide video {
      width: min(80vh, 80vw);
      height: min(80vh, 80vw);
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      background: #000;
    }

    .nav-controls {
      position: fixed;
      z-index: 20;
      right: 28px;
      bottom: 22px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(0,0,0,.15);
      padding: 8px 13px;
      border-radius: 999px;
      box-shadow: 0 18px 50px rgba(0,0,0,.25);
      backdrop-filter: blur(12px);
    }

    .nav-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: #f0f0f0;
      color: #111;
      cursor: pointer;
      font-size: 1.25rem;
      font-weight: 900;
      transition: .2s ease;
    }

    .nav-btn:hover {
      background: #111;
      color: #fff;
      transform: translateY(-1px);
    }

    .slide-counter {
      font-family: monospace;
      font-size: .88rem;
      color: #111;
      padding: 0 8px;
      min-width: 70px;
      text-align: center;
      font-weight: bold;
    }

    .progress {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,.18);
      z-index: 19;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #ffffff, #d6a85e);
      transition: width .35s ease;
    }

    @media (max-width: 768px) {
      .nav-controls {
        left: 50%;
        right: auto;
        bottom: 12px;
        transform: translateX(-50%);
      }

      .video-slide video {
        width: min(88vh, 88vw);
        height: min(88vh, 88vw);
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="presentation">
    <div class="slides-container" id="slidesContainer">

      <section class="slide">
        <img class="slide-image" src="assets/slide1.png" alt="Slide 1">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide2.png" alt="Slide 2">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide3.png" alt="Slide 3">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide4.png" alt="Slide 4">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide5.png" alt="Slide 5">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide6.png" alt="Slide 6">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide7.png" alt="Slide 7">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide8.png" alt="Slide 8">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide9.png" alt="Slide 9">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide10.png" alt="Slide 10">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide11.png" alt="Slide 11">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide12.png" alt="Slide 12">
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide13.png" alt="Slide 13">
      </section>

      <section class="slide">
        <div class="video-slide">
          <video id="demoVideo" src="assets/demo.mp4" controls playsinline></video>
        </div>
      </section>

      <section class="slide">
        <img class="slide-image" src="assets/slide15.png" alt="Slide 15">
      </section>

    </div>

    <div class="nav-controls">
      <button class="nav-btn" id="prevBtn" aria-label="Slide anterior">‹</button>
      <div class="slide-counter" id="slideCounter">1 / 15</div>
      <button class="nav-btn" id="nextBtn" aria-label="Próximo slide">›</button>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <script>
    const slidesContainer = document.getElementById("slidesContainer");
    const slides = document.querySelectorAll(".slide");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const slideCounter = document.getElementById("slideCounter");
    const progressBar = document.getElementById("progressBar");
    const demoVideo = document.getElementById("demoVideo");

    let currentSlide = 0;
    const totalSlides = slides.length;

    function updatePresentation() {
      slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;
      slideCounter.textContent = `${currentSlide + 1} / ${totalSlides}`;
      progressBar.style.width = `${((currentSlide + 1) / totalSlides) * 100}%`;

      if (demoVideo && currentSlide !== 13) {
        demoVideo.pause();
        demoVideo.currentTime = 0;
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        updatePresentation();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updatePresentation();
      }
    }

    nextBtn.addEventListener("click", nextSlide);
    prevBtn.addEventListener("click", prevSlide);

    document.addEventListener("keydown", function(event) {
      if (event.key === "ArrowRight" || event.key === " ") {
        nextSlide();
      }

      if (event.key === "ArrowLeft") {
        prevSlide();
      }
    });

    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener("touchstart", function(event) {
      touchStartX = event.changedTouches[0].screenX;
    }, { passive: true });

    document.addEventListener("touchend", function(event) {
      touchEndX = event.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const swipeDistance = touchEndX - touchStartX;

      if (swipeDistance < -50) {
        nextSlide();
      }

      if (swipeDistance > 50) {
        prevSlide();
      }
    }

    updatePresentation();
  </script>
</body>
</html>
