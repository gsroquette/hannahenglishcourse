<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Hannah Mixed Word Parts</title>

  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand: #ff6b35;
      --brand-dark: #d94c17;
      --brand-soft: #fff0e6;

      --blue: #2563eb;
      --blue-soft: #dbeafe;

      --green: #2e7d32;
      --green-soft: #e8f5e9;

      --red: #e53935;
      --red-soft: #ffebee;

      --yellow: #facc15;
      --yellow-soft: #fef9c3;

      --ink: #1f2937;
      --muted: #6b7280;
      --card: rgba(255, 255, 255, 0.94);
      --paper: #fff7ed;

      --slot-border: #cbd5e1;
      --slot-bg: #ffffff;

      --shadow-soft: 0 8px 24px rgba(15, 23, 42, 0.12);
      --shadow-tile: 0 6px 0 rgba(0, 0, 0, 0.16);

      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;

      --part-font: clamp(1.35rem, 4.2vw, 2.25rem);
      --part-min-w: 82px;
      --part-h: 68px;
      --gap: 10px;
    }

    @media (max-width: 480px) {
      :root {
        --part-min-w: 72px;
        --part-h: 60px;
        --gap: 8px;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Atkinson Hyperlegible', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 199, 150, 0.7), transparent 28%),
        radial-gradient(circle at top right, rgba(147, 197, 253, 0.7), transparent 26%),
        linear-gradient(135deg, #fff7ed 0%, #eff6ff 55%, #f0fdf4 100%);
      background-attachment: fixed;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(255, 107, 53, 0.15) 1px, transparent 1px),
        radial-gradient(rgba(37, 99, 235, 0.11) 1px, transparent 1px);
      background-size: 30px 30px, 44px 44px;
      background-position: 0 0, 16px 18px;
      opacity: 0.8;
      z-index: -1;
    }

    .page {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 1.02rem;
      font-weight: 800;
      cursor: pointer;
      color: #ffffff;
      background: #111827;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.22);
      transform: translateY(0);
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22);
    }

    .btn:focus-visible {
      outline: 4px solid rgba(37, 99, 235, 0.35);
      outline-offset: 3px;
    }

    .btn--pdf {
      background: var(--green);
    }

    .hero {
      position: relative;
      text-align: center;
      background: rgba(255, 255, 255, 0.72);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-xl);
      padding: 18px 18px 16px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(8px);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--yellow-soft);
      color: #854d0e;
      border: 2px solid rgba(250, 204, 21, 0.55);
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      color: var(--brand);
      font-size: clamp(2rem, 5.6vw, 3.7rem);
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: -0.04em;
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.95);
    }

    .subtitle {
      margin: 8px auto 0;
      max-width: 720px;
      color: var(--muted);
      font-size: clamp(1rem, 2.7vw, 1.2rem);
      line-height: 1.4;
      font-weight: 700;
    }

    .status {
      margin: 10px 0 0;
      min-height: 24px;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 800;
    }

    .good {
      color: var(--green);
      font-weight: 800;
    }

    .activity-container {
      width: 100%;
      display: grid;
      gap: 18px;
      padding-bottom: 24px;
    }

    .activity {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 18px;
      align-items: stretch;
      background: var(--card);
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-soft);
      padding: 18px;
      isolation: isolate;
    }

    .activity::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 10% 10%, rgba(255, 107, 53, 0.12), transparent 26%),
        radial-gradient(circle at 90% 20%, rgba(37, 99, 235, 0.12), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(46, 125, 50, 0.09), transparent 34%);
      pointer-events: none;
      z-index: -1;
    }

    .picture-card {
      display: grid;
      grid-template-rows: 1fr auto;
      align-items: center;
      justify-items: center;
      gap: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #fff7ed 100%);
      border: 3px solid rgba(255, 107, 53, 0.18);
      border-radius: var(--radius-lg);
      padding: 12px;
      min-height: 230px;
    }

    .picture-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(239, 246, 255, 0.92));
      border: 3px solid rgba(203, 213, 225, 0.7);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .picture-wrap img {
      width: 92%;
      height: 92%;
      object-fit: contain;
      display: block;
    }

    .listen-btn {
      width: 100%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 18px;
      background: var(--blue);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 13px 16px;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(30, 64, 175, 0.45);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .listen-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 rgba(30, 64, 175, 0.45);
    }

    .word-area {
      display: grid;
      align-content: center;
      gap: 14px;
      min-width: 0;
    }

    .instruction-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .instruction {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.8);
      border: 2px solid rgba(203, 213, 225, 0.8);
      border-radius: 999px;
      padding: 9px 13px;
      font-weight: 800;
      font-size: 1rem;
    }

    .word-number {
      color: var(--muted);
      font-weight: 800;
      font-size: 0.95rem;
    }

    .build-panel {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.85), rgba(239, 246, 255, 0.72));
      border: 2px solid rgba(203, 213, 225, 0.85);
      border-radius: 22px;
      padding: 14px;
    }

    .drop-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.95rem;
      text-align: center;
    }

    .drop-viewport {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 6px 4px 8px;
      scroll-snap-type: x proximity;
    }

    .drop-zone {
      display: flex;
      flex-wrap: nowrap;
      gap: var(--gap);
      align-items: center;
      justify-content: flex-start;
      min-height: calc(var(--part-h) + 12px);
      width: max-content;
      min-width: 100%;
      padding: 2px;
    }

    .slot {
      min-width: var(--part-min-w);
      width: auto;
      height: var(--part-h);
      padding: 0 16px;
      flex: 0 0 auto;
      scroll-snap-align: center;
      border: 3px dashed var(--slot-border);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.95));
      display: grid;
      place-items: center;
      position: relative;
      outline: none;
      transition: border-color 0.16s ease, background 0.16s ease, transform 0.16s ease;
    }

    .slot::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 12px;
      border: 2px solid rgba(226, 232, 240, 0.65);
      pointer-events: none;
    }

    .slot.empty::after {
      content: attr(data-position);
      color: rgba(100, 116, 139, 0.28);
      font-weight: 800;
      font-size: 1.2rem;
    }

    .slot.correct {
      border-style: solid;
      border-color: var(--green);
      background: linear-gradient(180deg, #ffffff, var(--green-soft));
      animation: happyPulse 0.35s ease;
    }

    .slot.wrong {
      border-style: solid;
      border-color: var(--red);
      background: linear-gradient(180deg, #ffffff, var(--red-soft));
      animation: shake 0.28s ease;
    }

    @keyframes happyPulse {
      50% { transform: scale(1.035); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .tray-wrap {
      background: rgba(255, 255, 255, 0.82);
      border: 2px solid rgba(203, 213, 225, 0.82);
      border-radius: 22px;
      padding: 13px;
    }

    .tray-label {
      text-align: center;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .tray {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--gap);
      min-height: calc(var(--part-h) + 10px);
    }

    .part-tile {
      min-width: var(--part-min-w);
      height: var(--part-h);
      padding: 0 18px;
      border: 3px solid rgba(17, 24, 39, 0.92);
      border-radius: 18px;
      background:
        linear-gradient(180deg, #ffffff 0%, #fef3c7 100%);
      color: var(--ink);
      display: grid;
      place-items: center;
      font-size: var(--part-font);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: grab;
      user-select: none;
      touch-action: none;
      box-shadow: var(--shadow-tile);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      outline: none;
      text-transform: uppercase;
    }

    .part-tile:hover {
      transform: translateY(-2px);
      filter: brightness(1.02);
    }

    .part-tile:active {
      cursor: grabbing;
    }

    .part-tile.dragging,
    .part-tile[aria-grabbed="true"] {
      outline: 4px solid rgba(37, 99, 235, 0.35);
      transform: scale(1.07);
      z-index: 1000;
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.22);
    }

    body.touch .part-tile.dragging {
      position: fixed;
      pointer-events: none;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      border: 2px solid rgba(203, 213, 225, 0.9);
      border-radius: 999px;
      background: #ffffff;
      color: var(--ink);
      padding: 9px 13px;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    .pill:hover {
      background: #f8fafc;
    }

    .pill:active {
      transform: scale(0.98);
    }

    .completed-word {
      display: none;
      text-align: center;
      padding: 10px 12px;
      border-radius: 18px;
      background: var(--green-soft);
      border: 2px solid rgba(46, 125, 50, 0.25);
      color: var(--green);
      font-size: clamp(1.25rem, 4vw, 2rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .activity[data-completed="true"] .completed-word {
      display: block;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.62);
      display: none;
      z-index: 1000;
    }

    #completion-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(92vw, 540px);
      transform: translate(-50%, -50%);
      background: #ffffff;
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.35);
      text-align: center;
      display: none;
      z-index: 1001;
      border: 4px solid rgba(46, 125, 50, 0.24);
    }

    #completion-modal h2 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      color: var(--green);
      font-weight: 800;
    }

    #completion-modal p {
      margin: 10px 0 0;
      font-size: 1.1rem;
      color: var(--muted);
      font-weight: 700;
    }

    #completion-modal button {
      margin-top: 18px;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--green);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
    }

    .confetti {
      position: fixed;
      pointer-events: none;
      z-index: 1200;
      width: 9px;
      height: 14px;
      background: #ffd54f;
      animation: fall 900ms ease-out forwards;
      border-radius: 3px;
    }

    @keyframes fall {
      to {
        transform: translateY(120vh) rotate(540deg);
        opacity: 0;
      }
    }

    @media (max-width: 820px) {
      .activity {
        grid-template-columns: 1fr;
      }

      .picture-card {
        min-height: unset;
      }

      .picture-wrap {
        width: min(260px, 100%);
      }

      .word-area {
        align-content: start;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 10px;
      }

      .hero {
        padding: 14px 12px;
      }

      .activity {
        padding: 12px;
        gap: 12px;
        border-radius: 22px;
      }

      .build-panel,
      .tray-wrap {
        padding: 10px;
      }

      .slot {
        padding: 0 13px;
      }

      .part-tile {
        padding: 0 14px;
      }

      .listen-btn {
        font-size: 1.05rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="toolbar" aria-label="Toolbar">
      <button id="backButton" class="btn">Back</button>
      <button id="pdfButton" class="btn btn--pdf" style="display:none" onclick="generatePDF()">Generate PDF</button>
    </div>

    <section class="hero" aria-labelledby="page-title">
      <div class="hero-badge">🧩 Listen and build</div>
      <h1 id="page-title">Hannah Mixed Word Parts</h1>
      <p class="subtitle">Listen to the whole word. Then put the word parts in the correct order.</p>
      <p class="status" id="sessionStatus" aria-live="polite"></p>
    </section>

    <div id="activity-container" class="activity-container"></div>
  </div>

  <div id="overlay" role="presentation"></div>

  <div id="completion-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Phase Completed!</h2>
    <p>Great job! You built all the words.</p>
    <button onclick="closeModal()">Close</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>

  <script>
    /* ================== Firebase ================== */
    const firebaseConfig = {
      apiKey: "AIzaSyDGgo2H_hDKXF88xN7XnLFNUj8ikMY7Xdc",
      authDomain: "hannahenglishcourse.firebaseapp.com",
      projectId: "hannahenglishcourse",
      storageBucket: "hannahenglishcourse.appspot.com",
      messagingSenderId: "449818788486",
      appId: "1:449818788486:web:8a49d3f68591e6fb3f0707",
      measurementId: "G-07VVJG9LRS",
      databaseURL: "https://hannahenglishcourse-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);

    document.getElementById('backButton').addEventListener('click', async function () {
      const { level, unit } = getLevelAndUnitFromURL();
      const currentPhase = parseInt(getPhaseFromURL());
      const nextPhase = currentPhase + 1;
      const user = firebase.auth().currentUser;

      if (!user) {
        alert("You must be logged in to perform this action.");
        return;
      }

      const userId = user.uid;
      const progressRef = firebase.database().ref(`usuarios/${userId}/progresso/${level}/${unit}/fase${nextPhase}`);

      try {
        const snapshot = await progressRef.once('value');
        const isUnlocked = snapshot.val();

        if (isUnlocked) {
          history.back();
        } else {
          if (confirm("The next phase is still locked. Leave this page before finishing it?")) {
            history.back();
          }
        }
      } catch (e) {
        alert("Error checking phase progress.");
      }
    });

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        const userId = user.uid;
        const userRoleRef = firebase.database().ref(`usuarios/${userId}/role`);

        userRoleRef.once('value').then((snapshot) => {
          const role = snapshot.val();

          if (role === 'professor' || role === 'proprietário') {
            document.getElementById("pdfButton").style.display = "inline-block";
          }
        });
      }
    });

    /* ================== Audio ================== */
    let selectedVoice = null;

    let wordPlayer = new Audio();
    wordPlayer.preload = 'auto';
    wordPlayer.setAttribute('playsinline', '');
    wordPlayer.setAttribute('webkit-playsinline', '');

    let audioPrimed = false;

    function primeAudioPipelineOnce() {
      if (audioPrimed) return;
      audioPrimed = true;

      try {
        const AC = window.AudioContext || window.webkitAudioContext;

        if (AC) {
          const ctx = new AC();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          gain.gain.value = 0;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.01);
        }
      } catch {}
    }

    window.addEventListener('pointerdown', primeAudioPipelineOnce, { once: true, passive: true });
    window.addEventListener('touchstart', primeAudioPipelineOnce, { once: true, passive: true });
    window.addEventListener('click', primeAudioPipelineOnce, { once: true, passive: true });

    function initializeVoices() {
      const voices = window.speechSynthesis.getVoices();
      selectedVoice = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("en-")) || voices[0] || null;
    }

    window.speechSynthesis.onvoiceschanged = initializeVoices;

    function speak(text) {
      const synth = window.speechSynthesis;

      try {
        if (!audioPrimed) primeAudioPipelineOnce();
      } catch {}

      try {
        if (!wordPlayer.paused) {
          wordPlayer.pause();
          wordPlayer.currentTime = 0;
        }
      } catch {}

      try {
        synth.cancel();
      } catch {}

      if (!selectedVoice) initializeVoices();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";

      if (selectedVoice) utterance.voice = selectedVoice;

      synth.speak(utterance);
    }

    function stopCurrentAudio() {
      try {
        if (!wordPlayer.paused) {
          wordPlayer.pause();
          wordPlayer.currentTime = 0;
        }
      } catch {}
    }

    function tryPlayAudio(url) {
      return new Promise((resolve) => {
        try {
          stopCurrentAudio();
        } catch {}

        try {
          if (!audioPrimed) primeAudioPipelineOnce();
        } catch {}

        wordPlayer.src = url;

        wordPlayer.onerror = () => resolve(false);

        try {
          wordPlayer.load();
          const playPromise = wordPlayer.play();

          if (playPromise && typeof playPromise.then === 'function') {
            playPromise.then(() => resolve(true)).catch(() => resolve(false));
          } else {
            resolve(true);
          }
        } catch {
          resolve(false);
        }
      });
    }

    async function playFirstAvailable(urls) {
      for (const url of urls) {
        if (await tryPlayAudio(url)) return true;
      }

      return false;
    }

    function playWordMp3OrSpeak(wordIndexZeroBased, wordText) {
      const { level, unit } = getLevelAndUnitFromURL();
      const n = wordIndexZeroBased + 1;
      const base = `../../${level}/${unit}/data1/sounds`;

      const urls = [
        `${base}/som${n}.mp3`,
        `${base}/som.${n}.mp3`
      ];

      playFirstAvailable(urls).then((ok) => {
        if (!ok) speak(wordText);
      });
    }

    function playSoftClick() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;

        const ctx = new AC();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.frequency.value = 520;
        gain.gain.value = 0.025;

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.045);
      } catch {}
    }

    /* ================== Estado ================== */
    const SESSION_LIMIT = 6;

    let activities = [];
    let completedWords = 0;

    const sessionStatus = document.getElementById('sessionStatus');
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    document.addEventListener('DOMContentLoaded', () => {
      if (isTouchDevice) document.body.classList.add('touch');

      initializeVoices();
      loadActivities();
    });

    function getPhaseFromURL() {
      return new URLSearchParams(window.location.search).get('fase');
    }

    function getLevelAndUnitFromURL() {
      const params = new URLSearchParams(window.location.search);

      return {
        level: params.get('level'),
        unit: params.get('unit')
      };
    }

    /* ================== Carregamento ================== */
    async function loadActivities() {
      const { level, unit } = getLevelAndUnitFromURL();

      if (!level || !unit) {
        sessionStatus.innerHTML = '<span class="err">Missing level or unit in the URL.</span>';
        return;
      }

      try {
        const base = `../../${level}/${unit}/data1`;

        let entries = await loadWordParts(base);

        if (entries.length > SESSION_LIMIT) {
          entries = entries.slice(0, SESSION_LIMIT);
        }

        activities = entries;

        entries.forEach((entry, index) => {
          const imageUrl = `${base}/imagens/imagem${index + 1}.png`;
          createActivity(imageUrl, entry.word, entry.parts, index, entries.length);
        });

        updateSessionStatus();
      } catch (error) {
        console.error('Erro ao carregar word parts:', error);
        sessionStatus.innerHTML = '<span class="err">Could not load word parts for this activity.</span>';
      }
    }

    async function loadWordParts(base) {
      const jsonPath = `${base}/word-parts.json`;
      const txtPath = `${base}/word-parts.txt`;

      try {
        const response = await fetch(jsonPath);

        if (response.ok) {
          const data = await response.json();
          const normalized = normalizeWordPartsJson(data);

          if (normalized.length) return normalized;
        }
      } catch (error) {
        console.warn('word-parts.json not loaded:', error);
      }

      try {
        const response = await fetch(txtPath);

        if (response.ok) {
          const text = await response.text();
          const normalized = parseWordPartsText(text);

          if (normalized.length) return normalized;
        }
      } catch (error) {
        console.warn('word-parts.txt not loaded:', error);
      }

      throw new Error('No valid word-parts.json or word-parts.txt found.');
    }

    function normalizeWordPartsJson(data) {
      if (!Array.isArray(data)) return [];

      return data
        .map((item) => {
          const word = String(item.word || '').trim();
          const partsRaw = Array.isArray(item.parts)
            ? item.parts
            : Array.isArray(item.syllables)
              ? item.syllables
              : [];

          const parts = partsRaw
            .map((part) => String(part || '').trim())
            .filter(Boolean);

          if (!word || !parts.length) return null;

          return {
            word,
            parts
          };
        })
        .filter(Boolean);
    }

    function parseWordPartsText(text) {
      return String(text || '')
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean)
        .map((line) => {
          const equalIndex = line.indexOf('=');

          if (equalIndex === -1) return null;

          const word = line.slice(0, equalIndex).trim();
          const partsText = line.slice(equalIndex + 1).trim();

          const parts = partsText
            .split('|')
            .map((part) => part.trim())
            .filter(Boolean);

          if (!word || !parts.length) return null;

          return {
            word,
            parts
          };
        })
        .filter(Boolean);
    }

    /* ================== Activity ================== */
    function createActivity(imageUrl, word, parts, wordIndex, totalWords) {
      const container = document.getElementById('activity-container');

      const activity = document.createElement('article');
      activity.className = 'activity';
      activity.dataset.completed = "false";

      const pictureCard = document.createElement('div');
      pictureCard.className = 'picture-card';

      const pictureWrap = document.createElement('div');
      pictureWrap.className = 'picture-wrap';

      const image = document.createElement('img');
      image.src = imageUrl;
      image.alt = `Image hint for ${word}`;
      image.onerror = () => {
        image.style.display = 'none';
        pictureWrap.innerHTML = '<span style="font-size:3rem;">🧩</span>';
      };

      pictureWrap.appendChild(image);

      const listenButton = document.createElement('button');
      listenButton.className = 'listen-btn';
      listenButton.type = 'button';
      listenButton.innerHTML = '<span aria-hidden="true">🔊</span> Listen';
      listenButton.addEventListener('click', () => playWordMp3OrSpeak(wordIndex, word));

      pictureCard.appendChild(pictureWrap);
      pictureCard.appendChild(listenButton);

      const wordArea = document.createElement('div');
      wordArea.className = 'word-area';

      const instructionRow = document.createElement('div');
      instructionRow.className = 'instruction-row';

      const instruction = document.createElement('div');
      instruction.className = 'instruction';
      instruction.innerHTML = '<span aria-hidden="true">✨</span> Build the word parts';

      const wordNumber = document.createElement('div');
      wordNumber.className = 'word-number';
      wordNumber.textContent = `Word ${wordIndex + 1}/${totalWords}`;

      instructionRow.appendChild(instruction);
      instructionRow.appendChild(wordNumber);

      const buildPanel = document.createElement('div');
      buildPanel.className = 'build-panel';

      const dropLabel = document.createElement('div');
      dropLabel.className = 'drop-label';
      dropLabel.innerHTML = '<span aria-hidden="true">⬇️</span> Put the parts here in order';

      const dropViewport = document.createElement('div');
      dropViewport.className = 'drop-viewport';

      const dropZone = document.createElement('div');
      dropZone.className = 'drop-zone';

      dropViewport.appendChild(dropZone);

      const slots = [];

      parts.forEach((part, index) => {
        const slot = document.createElement('div');
        slot.className = 'slot empty';
        slot.dataset.position = index + 1;
        slot.dataset.expected = part.toUpperCase();
        slot.setAttribute('role', 'button');
        slot.setAttribute('aria-label', `Position ${index + 1}`);
        slot.tabIndex = 0;

        slot.addEventListener('dragenter', (event) => event.preventDefault());
        slot.addEventListener('dragover', (event) => event.preventDefault());
        slot.addEventListener('drop', (event) => handleDrop(event, slot));

        slot.addEventListener('click', () => {
          if (activity.dataset.completed === "true") return;

          const child = slot.querySelector('.part-tile');

          if (child) {
            child.setAttribute('draggable', 'true');
            child.setAttribute('aria-grabbed', 'false');
            child.style.outline = 'none';

            tray.appendChild(child);

            slot.innerHTML = '';
            slot.classList.remove('correct', 'wrong');
            slot.classList.add('empty');

            updatePerSlotFeedback(false);
          }
        });

        if (isTouchDevice) {
          slot.addEventListener('touchstart', (event) => event.preventDefault(), { passive: false });
          slot.addEventListener('touchmove', (event) => event.preventDefault(), { passive: false });

          slot.addEventListener('touchend', (event) => {
            event.preventDefault();

            if (activity.dataset.completed === "true") return;

            if (!activeTile) {
              const child = slot.querySelector('.part-tile');

              if (child) {
                child.setAttribute('draggable', 'true');
                child.setAttribute('aria-grabbed', 'false');
                child.style.outline = 'none';

                tray.appendChild(child);

                slot.innerHTML = '';
                slot.classList.remove('correct', 'wrong');
                slot.classList.add('empty');

                updatePerSlotFeedback(false);
              }
            }
          }, { passive: false });
        }

        slots.push(slot);
        dropZone.appendChild(slot);
      });

      buildPanel.appendChild(dropLabel);
      buildPanel.appendChild(dropViewport);

      const trayWrap = document.createElement('div');
      trayWrap.className = 'tray-wrap';

      const trayLabel = document.createElement('div');
      trayLabel.className = 'tray-label';
      trayLabel.textContent = 'Drag the parts';

      const tray = document.createElement('div');
      tray.className = 'tray';

      trayWrap.appendChild(trayLabel);
      trayWrap.appendChild(tray);

      const shuffledParts = shuffleParts(parts);

      shuffledParts.forEach((part, index) => {
        const tile = createPartTile(part, index);
        tray.appendChild(tile);
      });

      const controls = document.createElement('div');
      controls.className = 'controls';

      const listenAgainButton = document.createElement('button');
      listenAgainButton.className = 'pill';
      listenAgainButton.type = 'button';
      listenAgainButton.innerHTML = '🔊 Listen again';
      listenAgainButton.addEventListener('click', () => playWordMp3OrSpeak(wordIndex, word));

      const resetButton = document.createElement('button');
      resetButton.className = 'pill';
      resetButton.type = 'button';
      resetButton.innerHTML = '↺ Reset';
      resetButton.addEventListener('click', resetActivity);

      controls.appendChild(listenAgainButton);
      controls.appendChild(resetButton);

      const completedWord = document.createElement('div');
      completedWord.className = 'completed-word';
      completedWord.textContent = word;

      wordArea.appendChild(instructionRow);
      wordArea.appendChild(buildPanel);
      wordArea.appendChild(trayWrap);
      wordArea.appendChild(controls);
      wordArea.appendChild(completedWord);

      activity.appendChild(pictureCard);
      activity.appendChild(wordArea);

      container.appendChild(activity);

      let activeTile = null;
      let touchOffsetX = 0;
      let touchOffsetY = 0;

      function createPartTile(part, index) {
        const tile = document.createElement('div');

        tile.className = 'part-tile';
        tile.textContent = part;
        tile.dataset.part = part.toUpperCase();
        tile.dataset.originalIndex = String(index);
        tile.setAttribute('draggable', 'true');
        tile.setAttribute('role', 'button');
        tile.setAttribute('aria-grabbed', 'false');
        tile.setAttribute('aria-label', `Word part ${part}`);
        tile.tabIndex = 0;

        tile.addEventListener('click', () => {
          playSoftClick();
        });

        tile.addEventListener('dragstart', (event) => {
          if (activity.dataset.completed === "true") {
            event.preventDefault();
            return;
          }

          try {
            event.dataTransfer.setData('text/plain', tile.textContent);
            event.dataTransfer.effectAllowed = 'move';
          } catch {}

          tile.setAttribute('aria-grabbed', 'true');
          tile.classList.add('dragging');

          playSoftClick();
        });

        tile.addEventListener('dragend', () => {
          tile.setAttribute('aria-grabbed', 'false');
          tile.classList.remove('dragging');
          tile.style.outline = 'none';
        });

        if (isTouchDevice) {
          tile.addEventListener('touchstart', (event) => handleTileTouchStart(event, tile), { passive: false });
          tile.addEventListener('touchmove', (event) => handleTileTouchMove(event, tile), { passive: false });
          tile.addEventListener('touchend', (event) => handleTileTouchEnd(event, tile), { passive: false });
          tile.addEventListener('touchcancel', () => handleTileTouchCancel(tile));
        }

        return tile;
      }

      function handleDrop(event, slot) {
        event.preventDefault();

        if (activity.dataset.completed === "true") return;

        const tile = document.querySelector('.part-tile[aria-grabbed="true"]');

        if (!tile) return;

        placeTileInSlot(tile, slot);
      }

      function placeTileInSlot(tile, slot) {
        if (slot.firstElementChild) {
          const existing = slot.firstElementChild;

          existing.setAttribute('draggable', 'true');
          existing.setAttribute('aria-grabbed', 'false');
          existing.classList.remove('dragging');
          existing.style.left = '';
          existing.style.top = '';
          existing.style.outline = '';

          tray.appendChild(existing);
        }

        slot.innerHTML = '';

        tile.setAttribute('draggable', 'false');
        tile.setAttribute('aria-grabbed', 'false');
        tile.classList.remove('dragging');
        tile.style.left = '';
        tile.style.top = '';
        tile.style.outline = '';

        slot.appendChild(tile);

        updatePerSlotFeedback(true);
        checkAnswer();
      }

      function handleTileTouchStart(event, tile) {
        if (activity.dataset.completed === "true") return;

        event.preventDefault();

        const touch = event.touches[0];
        const rect = tile.getBoundingClientRect();

        touchOffsetX = touch.clientX - rect.left;
        touchOffsetY = touch.clientY - rect.top;

        activeTile = tile;

        tile.setAttribute('aria-grabbed', 'true');
        tile.classList.add('dragging');

        playSoftClick();
      }

      function handleTileTouchMove(event) {
        if (!activeTile || activity.dataset.completed === "true") return;

        event.preventDefault();

        const touch = event.touches[0];
        const currentX = touch.clientX - touchOffsetX;
        const currentY = touch.clientY - touchOffsetY;

        activeTile.style.left = currentX + 'px';
        activeTile.style.top = currentY + 'px';

        slots.forEach((slot) => {
          const rect = slot.getBoundingClientRect();

          if (
            touch.clientX >= rect.left &&
            touch.clientX <= rect.right &&
            touch.clientY >= rect.top &&
            touch.clientY <= rect.bottom
          ) {
            slot.style.backgroundColor = '#f0f9ff';
          } else {
            slot.style.backgroundColor = '';
          }
        });
      }

      function handleTileTouchEnd(event, tile) {
        if (!activeTile || activity.dataset.completed === "true") return;

        event.preventDefault();

        const touch = event.changedTouches[0];
        let dropped = false;

        slots.forEach((slot) => {
          const rect = slot.getBoundingClientRect();

          if (
            touch.clientX >= rect.left &&
            touch.clientX <= rect.right &&
            touch.clientY >= rect.top &&
            touch.clientY <= rect.bottom
          ) {
            placeTileInSlot(tile, slot);
            dropped = true;
          }

          slot.style.backgroundColor = '';
        });

        if (!dropped) {
          tray.appendChild(tile);

          tile.classList.remove('dragging');
          tile.setAttribute('aria-grabbed', 'false');
          tile.style.left = '';
          tile.style.top = '';
          tile.style.outline = '';

          updatePerSlotFeedback(false);
        }

        activeTile = null;
      }

      function handleTileTouchCancel(tile) {
        if (activeTile) {
          tile.classList.remove('dragging');
          tile.setAttribute('aria-grabbed', 'false');
          tile.style.left = '';
          tile.style.top = '';
          tile.style.outline = '';
          activeTile = null;
        }
      }

      function currentParts() {
        return slots.map((slot) => slot.querySelector('.part-tile')?.dataset.part || '');
      }

      function updatePerSlotFeedback(animateWrong) {
        slots.forEach((slot) => {
          const tile = slot.querySelector('.part-tile');

          if (!tile) {
            slot.classList.remove('correct', 'wrong');
            slot.classList.add('empty');
            return;
          }

          const expected = slot.dataset.expected;
          const actual = tile.dataset.part;
          const isCorrect = expected === actual;

          slot.classList.remove('empty');
          slot.classList.toggle('correct', isCorrect);
          slot.classList.toggle('wrong', !isCorrect && animateWrong);
        });
      }

      function checkAnswer() {
        const allFilled = slots.every((slot) => !!slot.querySelector('.part-tile'));

        if (!allFilled) return;

        const answer = currentParts().join('');
        const expected = parts.map((part) => part.toUpperCase()).join('');

        if (answer === expected) {
          if (activity.dataset.completed === "false") {
            activity.dataset.completed = "true";
            completedWords++;

            slots.forEach((slot) => {
              const tile = slot.querySelector('.part-tile');

              if (tile) {
                tile.setAttribute('draggable', 'false');
                tile.setAttribute('aria-grabbed', 'false');
              }

              slot.classList.remove('wrong', 'empty');
              slot.classList.add('correct');
            });

            playWordMp3OrSpeak(wordIndex, word);
            celebrate(activity);
            updateSessionStatus();

            if (completedWords === activities.length) {
              showCompletionModal();

              firebase.auth().onAuthStateChanged((user) => {
                if (user) updateNextPhase(user.uid);
              });
            }
          }
        } else {
          updatePerSlotFeedback(true);
        }
      }

      function resetActivity() {
        if (activity.dataset.completed === "true") return;

        slots.forEach((slot) => {
          const tile = slot.querySelector('.part-tile');

          if (tile) {
            tile.setAttribute('draggable', 'true');
            tile.setAttribute('aria-grabbed', 'false');
            tile.classList.remove('dragging');
            tile.style.left = '';
            tile.style.top = '';
            tile.style.outline = '';

            tray.appendChild(tile);
          }

          slot.innerHTML = '';
          slot.classList.remove('correct', 'wrong');
          slot.classList.add('empty');
        });

        updatePerSlotFeedback(false);
      }
    }

    function shuffleParts(parts) {
      const arr = parts.map((part) => String(part).trim()).filter(Boolean);

      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }

      const original = parts.join('|').toUpperCase();
      const shuffled = arr.join('|').toUpperCase();

      if (arr.length > 1 && original === shuffled) {
        [arr[0], arr[1]] = [arr[1], arr[0]];
      }

      return arr;
    }

    function updateSessionStatus() {
      const total = activities.length;
      const done = completedWords;

      if (total === 0) {
        sessionStatus.textContent = '';
        return;
      }

      sessionStatus.textContent = `Activities: ${done}/${total}`;

      if (done === total) {
        sessionStatus.innerHTML = `<span class="good">All done! Great job!</span>`;
      }
    }

    function showCompletionModal() {
      document.getElementById('overlay').style.display = 'block';
      document.getElementById('completion-modal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('completion-modal').style.display = 'none';
    }

    function celebrate(host) {
      const rect = host.getBoundingClientRect();
      const baseY = Math.max(0, rect.top + 10);
      const minX = Math.max(0, rect.left - 50);
      const maxX = Math.min(window.innerWidth, rect.right + 50);
      const colors = ['#ffd54f', '#4fc3f7', '#ce93d8', '#81c784', '#ff8a65'];

      for (let i = 0; i < 22; i++) {
        const confetti = document.createElement('div');

        confetti.className = 'confetti';
        confetti.style.left = `${Math.random() * (maxX - minX) + minX}px`;
        confetti.style.top = `${baseY}px`;
        confetti.style.background = colors[i % colors.length];

        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 1000);
      }
    }

    /* ================== Progresso ================== */
    async function updateNextPhase(userId) {
      const currentPhase = getPhaseFromURL();
      const { level, unit } = getLevelAndUnitFromURL();
      const dbRef = firebase.database().ref(`usuarios/${userId}/progresso/${level}/${unit}`);

      try {
        if (currentPhase === "last") {
          const nextUnit = `Unit${parseInt(unit.replace('Unit', '')) + 1}`;

          await firebase.database().ref(`usuarios/${userId}/progresso/${level}/${nextUnit}`).set({
            fase1: true
          });
        } else if (currentPhase === "end") {
          const nextLevel = `Level${parseInt(level.replace('Level', '')) + 1}`;

          await firebase.database().ref(`usuarios/${userId}/progresso/${nextLevel}/Unit1`).set({
            fase1: true
          });
        } else {
          const nextPhase = parseInt(currentPhase) + 1;

          await dbRef.update({
            [`fase${currentPhase}`]: true,
            [`fase${nextPhase}`]: true
          });
        }
      } catch (err) {
        console.error("Erro ao atualizar o progresso da fase:", err);
      }
    }

    /* ================== PDF ================== */
    async function generatePDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const logo = new Image();
      logo.src = 'Logo.png';

      function header() {
        doc.setFontSize(12);
        doc.text("Name: __________________________________________ Date: ____________", 50, 20);
        doc.setFontSize(16);
        doc.text("Hannah Mixed Word Parts", 10, 50);
      }

      function drawActivity(activityEl, y) {
        const imgEl = activityEl.querySelector('img');

        if (imgEl && imgEl.style.display !== 'none') {
          try {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = imgEl.naturalWidth || 120;
            canvas.height = imgEl.naturalHeight || 120;

            ctx.drawImage(imgEl, 0, 0, canvas.width, canvas.height);

            const data = canvas.toDataURL('image/png');

            doc.addImage(data, 'PNG', 10, y, 24, 24);
          } catch {}
        }

        const slotsCount = activityEl.querySelectorAll('.slot').length;
        const tiles = [
          ...activityEl.querySelectorAll('.tray .part-tile'),
          ...activityEl.querySelectorAll('.slot .part-tile')
        ].map((tile) => tile.textContent.trim());

        let x = 50;

        doc.setFontSize(14);

        for (let i = 0; i < slotsCount; i++) {
          doc.text("________", x, y + 10);
          x += 28;
        }

        if (tiles.length) {
          doc.setFontSize(11);
          doc.text(`Word parts: ${tiles.join('   ')}`, 50, y + 22);
        }
      }

      logo.onload = function () {
        try {
          doc.addImage(logo, 'PNG', 10, 10, 30, 30);
        } catch {}

        header();

        let y = 62;

        document.querySelectorAll('.activity').forEach((activityEl) => {
          if (y > 270) {
            doc.addPage();
            y = 20;
          }

          drawActivity(activityEl, y);
          y += 38;
        });

        doc.save("Hannah_Mixed_Word_Parts.pdf");
      };

      logo.onerror = function () {
        header();

        let y = 62;

        document.querySelectorAll('.activity').forEach((activityEl) => {
          if (y > 270) {
            doc.addPage();
            y = 20;
          }

          drawActivity(activityEl, y);
          y += 38;
        });

        doc.save("Hannah_Mixed_Word_Parts.pdf");
      };
    }
  </script>
</body>
