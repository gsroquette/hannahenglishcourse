<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select a Unit - Level A</title>
    <link rel="stylesheet" href="../CSS/styles.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .map-container {
            width: 100%;
            min-height: 100vh;
            position: relative;
            background-image: url('../../imagens/fundo.png');
            background-repeat: repeat;
            background-size: 200%;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 30px;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            padding: 0 16px;
            text-align: center;
        }

        .header-container h1 {
            margin: 0;
            font-size: 36px;
            color: #4CAF50;
            text-align: center;
        }

        .level-display {
            margin-top: 5px;
            font-family: Times, serif;
            font-weight: bold;
            color: black;
            font-size: 24px;
            text-align: center;
        }

        .back-button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: black;
            color: white;
            text-align: center;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .permission-message {
            display: none;
            width: min(90%, 620px);
            margin: 12px auto 0;
            padding: 12px 16px;
            border-radius: 12px;
            background: #fff3cd;
            border: 1px solid #ffe08a;
            color: #5d4037;
            font-weight: 700;
            line-height: 1.4;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        main {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .units {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 200px));
            gap: 20px;
            padding: 20px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            justify-content: center;
            justify-items: center;
            align-items: center;
        }

        .unit-button {
            display: block;
            text-align: center;
            padding: 12px 0;
            color: green;
            border: 2px solid green;
            border-radius: 20px;
            background-color: white;
            text-decoration: none;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            max-width: 200px;
            box-sizing: border-box;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        }

        .unit-button:hover {
            background-color: green;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.18);
        }

        .unit-button.disabled {
            background-color: rgba(128, 128, 128, 0.3);
            border-color: rgba(128, 128, 128, 0.5);
            color: rgba(128, 128, 128, 0.5);
            pointer-events: none;
            box-shadow: none;
            transform: none;
        }

        @media (max-width: 480px) {
            .map-container {
                background-size: 260%;
            }

            .header-container h1 {
                font-size: 30px;
            }

            .level-display {
                font-size: 22px;
            }

            .units {
                grid-template-columns: minmax(180px, 220px);
                justify-content: center;
                justify-items: center;
                padding: 18px 12px;
                gap: 14px;
            }

            .unit-button {
                width: 100%;
                max-width: 220px;
                padding: 13px 0;
            }
        }
    </style>
</head>
<body>
    <div class="map-container">
        <!-- Cabeçalho -->
        <header class="header-container">
            <h1>Select a Unit</h1>
            <div id="level-display" class="level-display"></div>
        </header>
        
        <!-- Botão de voltar -->
        <div style="text-align: center;">
            <button class="back-button" onclick="window.location.href='../index.html';">Back</button>
        </div>

        <div id="permission-message" class="permission-message"></div>

        <!-- Container das unidades (será preenchido via JavaScript) -->
        <main>
            <div class="units" id="units-container"></div>            
        </main>
    </div>

    <!-- Firebase Configuration and Initialization -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDGgo2H_hDKXF88xN7XnLFNUj8ikMY7Xdc",
            authDomain: "hannahenglishcourse.firebaseapp.com",
            projectId: "hannahenglishcourse",
            storageBucket: "hannahenglishcourse.appspot.com",
            messagingSenderId: "449818788486",
            appId: "1:449818788486:web:8a49d3f68591e6fb3f0707",
            measurementId: "G-07VVJG9LRS",
            databaseURL: "https://hannahenglishcourse-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);

        const db = firebase.database();
        const auth = firebase.auth();

        const VALID_LEVELS = ["Level0", "Level1", "Level2", "Level3", "Level4"];

        function setPermissionMessage(message) {
            const msg = document.getElementById('permission-message');
            if (!msg) return;

            if (message) {
                msg.textContent = message;
                msg.style.display = 'block';
            } else {
                msg.textContent = '';
                msg.style.display = 'none';
            }
        }

        // Função para criar os 20 botões de unidades
        function criarBotoesUnidades() {
            const container = document.getElementById('units-container');
            container.innerHTML = ''; // Limpa o container antes de adicionar
            setPermissionMessage('');

            for (let i = 1; i <= 20; i++) {
                const button = document.createElement('a');
                button.href = `Unit${i}/index.html`;
                button.id = `unit${i}`;
                button.className = 'unit-button disabled'; // Inicia bloqueado
                button.textContent = `Unit ${i}`;
                container.appendChild(button);
            }
        }

        // Função para extrair o nível da URL de forma precisa
        function getCurrentLevel() {
            const path = window.location.pathname;
            // Extrai o nível da URL (ex: /level1/ → Level1)
            const levelMatch = path.match(/\/(level[a-z0-9]+)\//i);
            if (levelMatch && levelMatch[1]) {
                // Capitaliza a primeira letra (level1 → Level1)
                return levelMatch[1].charAt(0).toUpperCase() + levelMatch[1].slice(1);
            }
            return 'Level1'; // Padrão seguro
        }

        function normalizarNivel(n) {
            if (!n) return null;
            n = String(n).trim().toLowerCase();

            if (n === "level0" || n === "0" || n === "starter") return "Level0";
            if (n === "level1" || n === "1") return "Level1";
            if (n === "level2" || n === "2") return "Level2";
            if (n === "level3" || n === "3") return "Level3";
            if (n === "level4" || n === "4") return "Level4";

            return null;
        }

        function extrairNumeroUnidade(unitValue) {
            if (!unitValue) return null;
            const match = String(unitValue).match(/unit\s*(\d+)/i);
            if (match && match[1]) return parseInt(match[1], 10);
            return null;
        }

        function bloquearTodasUnidades() {
            for (let i = 1; i <= 20; i++) {
                const button = document.getElementById(`unit${i}`);
                if (button) {
                    button.classList.add('disabled');
                }
            }
        }

        function liberarUnidadesAte(unitLimitNumber) {
            for (let i = 1; i <= 20; i++) {
                const button = document.getElementById(`unit${i}`);
                if (!button) continue;

                if (i <= unitLimitNumber) {
                    button.classList.remove('disabled');
                } else {
                    button.classList.add('disabled');
                }
            }
        }

        function bloquearAlunoAtreladoSemLiberacao(message) {
            bloquearTodasUnidades();
            setPermissionMessage(message || "Your teacher has not released this level yet.");
        }

        // Função para verificar se uma unidade está liberada pelo progresso individual do aluno
        async function verificarUnidadeLiberada(userId, level, unitNumber) {
            try {
                const unitPath = `usuarios/${userId}/progresso/${level}/Unit${unitNumber}`;
                const snapshot = await db.ref(unitPath).once('value');
                const unitData = snapshot.val();
                
                // Se não existir no BD, não está liberada
                if (unitData === null) {
                    console.log(`Unit${unitNumber} não encontrada no BD (${level})`);
                    return false;
                }
                
                // Se for objeto, verifica se alguma fase está true
                if (typeof unitData === 'object') {
                    const liberada = Object.values(unitData).some(val => val === true);
                    console.log(`Unit${unitNumber} tem ${liberada ? 'fases liberadas' : 'nenhuma fase liberada'}`);
                    return liberada;
                }
                
                // Se for booleano, retorna o valor
                console.log(`Unit${unitNumber} está ${unitData ? 'liberada' : 'bloqueada'}`);
                return !!unitData;
            } catch (error) {
                console.error(`Erro ao verificar Unit${unitNumber}:`, error);
                return false;
            }
        }

        // Função principal para carregar o progresso individual
        async function carregarProgresso(userId) {
            const currentLevel = getCurrentLevel();
            console.log(`Verificando progresso para nível: ${currentLevel}`);
            
            document.getElementById('level-display').textContent = currentLevel;
            setPermissionMessage('');
            
            for (let i = 1; i <= 20; i++) {
                const button = document.getElementById(`unit${i}`);
                if (!button) continue;
                
                const liberada = await verificarUnidadeLiberada(userId, currentLevel, i);
                button.classList.toggle('disabled', !liberada);
            }
        }

        // Desbloquear todas as unidades (para professores/proprietários)
        function desbloquearTodasUnidades() {
            setPermissionMessage('');

            for (let i = 1; i <= 20; i++) {
                const button = document.getElementById(`unit${i}`);
                if (button) {
                    button.classList.remove('disabled');
                }
            }
            console.log("Todas unidades liberadas (modo professor/proprietário)");
        }

        // Função para verificar o papel do usuário
        async function verificarPapelUsuario(userId) {
            try {
                const snapshot = await db.ref(`usuarios/${userId}/role`).once('value');
                return snapshot.val();
            } catch (error) {
                console.error("Erro ao verificar papel do usuário:", error);
                return null;
            }
        }

        async function carregarDadosUsuario(userId) {
            try {
                const snapshot = await db.ref(`usuarios/${userId}`).once('value');
                return snapshot.val() || {};
            } catch (error) {
                console.error("Erro ao carregar dados do usuário:", error);
                return {};
            }
        }

        function getLevelLimitFromClassAccess(limits, currentLevel) {
            if (!limits || typeof limits !== 'object') return null;

            const normalizedCurrentLevel = normalizarNivel(currentLevel);
            if (!normalizedCurrentLevel) return null;

            const limit = limits[normalizedCurrentLevel];

            if (
                limit &&
                limit.enabled === true &&
                limit.unit &&
                limit.phase &&
                typeof limit.order !== "undefined"
            ) {
                return limit;
            }

            return null;
        }

        async function carregarPermissoesDaTurma(userId, userData, currentLevel) {
            try {
                if (!userData.atrelado_professor) {
                    return {
                        hasTeacher: false,
                        foundClass: false,
                        levelLimit: null
                    };
                }

                const snapTurmas = await db.ref(`usuarios/${userData.atrelado_professor}/turmas`).once('value');
                const turmas = snapTurmas.val() || {};
                let turmaDoAluno = null;

                for (const turmaId in turmas) {
                    const studentRecord = turmas[turmaId]?.students?.[userId];

                    if (studentRecord) {
                        turmaDoAluno = turmas[turmaId];
                        break;
                    }
                }

                if (!turmaDoAluno) {
                    return {
                        hasTeacher: true,
                        foundClass: false,
                        levelLimit: null
                    };
                }

                const limits = turmaDoAluno.class_access?.limits || {};
                const levelLimit = getLevelLimitFromClassAccess(limits, currentLevel);

                return {
                    hasTeacher: true,
                    foundClass: true,
                    levelLimit: levelLimit
                };
            } catch (error) {
                console.error("Erro ao carregar permissões da turma:", error);
                return {
                    hasTeacher: true,
                    foundClass: false,
                    levelLimit: null,
                    error: error
                };
            }
        }

        function aplicarLimiteDaTurmaNaPaginaDeUnits(levelLimit, currentLevel) {
            document.getElementById('level-display').textContent = currentLevel;

            const unitLimitNumber = extrairNumeroUnidade(levelLimit.unit);

            if (!unitLimitNumber) {
                bloquearAlunoAtreladoSemLiberacao("Your teacher has not released this level yet.");
                return;
            }

            liberarUnidadesAte(unitLimitNumber);

            console.log(`${currentLevel} liberado pela turma até ${levelLimit.unit} / ${levelLimit.phase}`);
        }

        // Monitorar autenticação
        auth.onAuthStateChanged(async (user) => {
            try {
                criarBotoesUnidades(); // Recria os botões

                const currentLevel = getCurrentLevel();
                document.getElementById('level-display').textContent = currentLevel;
                
                if (!user) {
                    console.log("Usuário não autenticado - mantendo unidades bloqueadas");
                    return;
                }

                const role = await verificarPapelUsuario(user.uid);
                
                if (role === 'proprietario' || role === 'professor') {
                    desbloquearTodasUnidades();
                    console.log(`Modo professor/proprietário - todas unidades liberadas em ${currentLevel}`);
                } else {
                    const userData = await carregarDadosUsuario(user.uid);

                    if (userData.atrelado_professor) {
                        const classPermission = await carregarPermissoesDaTurma(user.uid, userData, currentLevel);

                        if (classPermission.foundClass && classPermission.levelLimit) {
                            aplicarLimiteDaTurmaNaPaginaDeUnits(classPermission.levelLimit, currentLevel);
                            console.log(`Permissões da turma carregadas para ${currentLevel}`);
                        } else {
                            bloquearAlunoAtreladoSemLiberacao("Your teacher has not released this level yet.");
                            console.log(`Aluno atrelado sem liberação de turma para ${currentLevel}`);
                        }
                    } else {
                        await carregarProgresso(user.uid);
                        console.log(`Progresso do aluno carregado para ${currentLevel}`);
                    }
                }
            } catch (error) {
                console.error("Erro no fluxo de autenticação:", error);
            }
        });

        // Inicialização
        document.addEventListener("DOMContentLoaded", function() {
            console.log("Página carregada - Nível atual:", getCurrentLevel());
            criarBotoesUnidades();
            document.getElementById('level-display').textContent = getCurrentLevel();
        });
    </script>
</body>
</html>
